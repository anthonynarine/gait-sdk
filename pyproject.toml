[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auth_integration"
version = "0.3.12"
description = "Reusable authentication and permissions package for Django + FastAPI projects using an external Auth API (Gait)."
readme = "README.md"
requires-python = ">=3.9"

authors = [
    { name = "Anthony Narine", email = "you@example.com" }
]

dependencies = [
    # Core, framework-agnostic runtime deps — required to import
    # auth_integration.client / .settings / .exceptions on their own.
    "httpx >=0.25",
    "python-decouple >=3.6",

    # NOTE: `requests` and `PyJWT` are declared but not currently imported
    # anywhere in this package's source (auth_integration/*.py) — verified by
    # direct grep during SDK1. `docs/AuthIntegration_Client.md` documents that
    # this package used `requests` (sync) before migrating to `httpx.AsyncClient`
    # (async), so `requests` is confirmed legacy from that migration. Neither
    # has a known current consumer relying on them being *importable from this
    # package* specifically (as opposed to being present in their own
    # environment already), but per SDK1 policy backward compatibility beats
    # dependency-list neatness — left in place rather than removed on
    # inspection alone. Candidate for a deliberate, separately-reviewed
    # removal in a later milestone once confirmed no consumer depends on the
    # transitive install.
    "requests >=2.31.0",
    "PyJWT >=2.10.1",
]

[project.optional-dependencies]
# Install with `auth_integration[django]` for the DRF authentication adapter
# (auth_integration.django.authentication / auth_integration.authentication).
#
# SDK2 revisits SDK1's original choice to leave Django out of this list and
# rely on djangorestframework installing it transitively. `auth_integration`
# does directly import Django itself, not just DRF: `auth_integration/settings.py`
# (core, imported regardless of which extra is installed) does
# `from django.conf import settings as django_settings` inside a try/except
# so it stays optional when Django isn't present at all — but when the
# [django] extra IS installed, that import is a real, direct runtime
# dependency, not merely DRF's implementation detail. Per SDK2's stated
# principle ("if our code directly imports a runtime dependency, declare it
# directly"), Django is now listed explicitly here rather than left to
# whatever range djangorestframework's own install_requires happens to pin.
# Floor picked to match the oldest Django LTS still supported as of this
# milestone and to stay compatible with the existing djangorestframework
# floor below (not a version this package has been newly tested against —
# just a documented, non-arbitrary choice, consistent with what SDK1's own
# clean-install verification already exercised at the high end, Django 5.2).
django = [
    "Django >=4.2",
    "djangorestframework >=3.14",
    "asgiref >=3.6",
]

# Install with `auth_integration[fastapi]` for the FastAPI dependency adapter
# (auth_integration.fastapi.dependencies). `starlette` is listed explicitly
# because dependencies.py imports from it directly, not only transitively
# through fastapi.
fastapi = [
    "fastapi >=0.100",
    "starlette >=0.27",
]

# Install with `auth_integration[test]` to run this package's own test suite.
test = [
    "pytest >=7",
    "pytest-asyncio >=0.21",
]

[tool.setuptools.packages.find]
include = ["auth_integration*", "auth_integration.*"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
