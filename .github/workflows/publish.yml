name: Publish to PyPI

# Releases happen ONLY by pushing a version tag (vX.Y.Z) whose number matches
# pyproject.toml. Nothing publishes from a branch push, and no human uploads
# from a laptop.
#
# Authentication is PyPI "Trusted Publishing" (OpenID Connect): PyPI is told
# to trust exactly this repository + this workflow file + the `pypi`
# environment. GitHub hands the job a short-lived identity token; there is no
# PyPI password or API token stored anywhere to leak.
# Setup walkthrough: docs/PUBLISHING.md
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    # The full suite must pass for the exact commit being released.
    uses: ./.github/workflows/python-tests.yml

  build:
    name: Build distribution
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # GAIT-SEC-081: no token left in .git/config
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Tag must match pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$VERSION"
          test "$TAG" = "$VERSION" || { echo "::error::Tag v$TAG does not match pyproject version $VERSION"; exit 1; }

      - name: Build sdist and wheel
        run: |
          # GAIT-SEC-082: build tools and backend are hash-pinned; the build
          # runs without isolation so nothing unpinned is fetched for it.
          python -m pip install --require-hashes -r .github/requirements/release.txt
          python -m build --no-isolation
          twine check --strict dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The `pypi` environment can require a manual approval click in GitHub
    # (Settings -> Environments -> pypi -> Required reviewers).
    environment:
      name: pypi
      url: https://pypi.org/project/gait-sdk/
    permissions:
      id-token: write  # REQUIRED for Trusted Publishing; nothing else is granted
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Publish (Trusted Publishing, with attestations)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
