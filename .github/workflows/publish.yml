name: Publish to PyPI

# Releases happen ONLY by pushing a version tag (vX.Y.Z) whose number matches
# pyproject.toml. Nothing publishes from a branch push, and no human uploads
# from a laptop.
#
# Authentication is PyPI "Trusted Publishing" (OpenID Connect): PyPI is told
# to trust exactly this repository + this workflow file + the `pypi`
# environment. GitHub hands the job a short-lived identity token; there is no
# PyPI password or API token stored anywhere to leak.
# Setup walkthrough: docs/PUBLISHING.md
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    # The full suite must pass for the exact commit being released.
    uses: ./.github/workflows/python-tests.yml

  build:
    name: Build distribution
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag must match pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$VERSION"
          test "$TAG" = "$VERSION" || { echo "::error::Tag v$TAG does not match pyproject version $VERSION"; exit 1; }

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The `pypi` environment can require a manual approval click in GitHub
    # (Settings -> Environments -> pypi -> Required reviewers).
    environment:
      name: pypi
      url: https://pypi.org/project/gait-sdk/
    permissions:
      id-token: write  # REQUIRED for Trusted Publishing; nothing else is granted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish (Trusted Publishing, with attestations)
        uses: pypa/gh-action-pypi-publish@release/v1
