name: Python Package Tests

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # SDK1: the full test suite exercises both the Django and FastAPI
      # adapters, so install both extras plus the test extra — all declared
      # in pyproject.toml, not hand-picked here. This is also what proves
      # the [test] extra itself is sufficient to run the suite.
      - name: Install package (django + fastapi + test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[django,fastapi,test]"

      - name: Run tests
        run: |
          pytest -v -s --maxfail=1 --disable-warnings --cov=auth_integration --cov-report=term-missing

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: ./.coverage

  verify-clean-install:
    name: Verify clean install (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        mode: [ core, django, fastapi ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # SDK1: each mode installs from a FRESH environment using only what
      # pyproject.toml declares for that mode — no manually-listed packages
      # standing in for an undeclared dependency. This is what actually
      # proves the dependency metadata is correct, rather than trusting
      # that some other package's requirements.txt happens to provide
      # httpx/Django/DRF/FastAPI/starlette transitively.
      - name: Install package (core only, no extras)
        if: matrix.mode == 'core'
        run: python -m pip install .

      - name: Install package (django extra)
        if: matrix.mode == 'django'
        run: python -m pip install ".[django]"

      - name: Install package (fastapi extra)
        if: matrix.mode == 'fastapi'
        run: python -m pip install ".[fastapi]"

      - name: Import core surface (all modes)
        run: |
          python -c "
          from auth_integration.client import validate_token, get_claims
          from auth_integration.exceptions import AuthServiceUnavailable, InvalidTokenError
          from auth_integration.settings import GAIT_AUTH_URL, GAIT_TIMEOUT
          from auth_integration.utils import get_user_claims, get_user_id, get_user_role, is_admin
          print('core import OK')
          "

      - name: Import Django adapter (django mode only)
        if: matrix.mode == 'django'
        run: |
          python -c "
          from auth_integration.authentication import ExternalJWTAuthentication, ClaimsUser
          from auth_integration.django.authentication import UserClaims, AuthenticationServiceUnavailable
          from auth_integration.permissions import HasRole, HasAnyRole
          assert ExternalJWTAuthentication().authenticate_header(None) == 'Bearer'
          print('django adapter import OK')
          "

      - name: Import FastAPI adapter (fastapi mode only)
        if: matrix.mode == 'fastapi'
        run: |
          python -c "
          from auth_integration.fastapi.dependencies import verify_token, get_current_user
          from auth_integration.permissions import HasRole, HasAnyRole, require_role
          print('fastapi adapter import OK')
          "
