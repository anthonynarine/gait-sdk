name: Tests

# Runs on every PR and on pushes to main/release branches. Also callable from
# the publish workflow, so a release can never skip the full suite.
on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # GAIT-SEC-081: no token left in .git/config

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # The suite exercises both adapters, so install both extras plus the
      # test extra -- all declared in pyproject.toml, nothing hand-picked here.
      - name: Install package with django + fastapi + test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[django,fastapi,test]"

      - name: Run tests
        run: pytest -q --maxfail=1

  verify-clean-install:
    name: Clean install (${{ matrix.mode }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        mode: [core, django, fastapi]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # GAIT-SEC-081: no token left in .git/config
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Each mode installs into a FRESH environment using only what
      # pyproject.toml declares -- this is what proves the dependency
      # metadata is complete (nothing provided "by accident" transitively).
      - name: Install (core, no extras)
        if: matrix.mode == 'core'
        run: python -m pip install .
      - name: Install (django extra)
        if: matrix.mode == 'django'
        run: python -m pip install ".[django]"
      - name: Install (fastapi extra)
        if: matrix.mode == 'fastapi'
        run: python -m pip install ".[fastapi]"

      - name: Import core surface
        run: |
          python -c "
          import gait_sdk
          from gait_sdk.verification import JwksVerifier, VerifiedIdentity, is_secure_gait_url
          from gait_sdk.session import check_session_live
          from gait_sdk.exceptions import AuthServiceUnavailable, InvalidTokenError
          print('gait_sdk', gait_sdk.__version__, 'core import OK')
          "

      # GAIT-SEC-033: `requests` is no longer a dependency; a core install
      # must neither pull it in nor need it.
      - name: Core install does not bring in requests
        if: matrix.mode == 'core'
        run: |
          python -c "
          import importlib.util
          assert importlib.util.find_spec('requests') is None, 'requests is installed'
          print('requests absent OK')
          "

      - name: Import Django adapter
        if: matrix.mode == 'django'
        run: |
          python -c "
          from gait_sdk.authentication import ExternalJWTAuthentication
          from gait_sdk.django.authentication import require_live_session
          assert ExternalJWTAuthentication().authenticate_header(None) == 'Bearer'
          print('django adapter import OK')
          "

      - name: Import FastAPI adapter
        if: matrix.mode == 'fastapi'
        run: |
          python -c "
          from gait_sdk.fastapi.dependencies import verify_token, require_live_session
          print('fastapi adapter import OK')
          "

      - name: Deprecated auth_integration alias still works (0.5.x)
        run: |
          python -W ignore::DeprecationWarning -c "
          import auth_integration.verification as old, gait_sdk.verification as new
          assert old is new
          print('compat shim OK')
          "

  build:
    name: Build + check distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # GAIT-SEC-081: no token left in .git/config
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          # GAIT-SEC-082: build tools and backend are hash-pinned; the build
          # runs without isolation so nothing unpinned is fetched for it.
          python -m pip install --require-hashes -r .github/requirements/release.txt
          python -m build --no-isolation
      # twine check validates the metadata PyPI will render (README, classifiers).
      - name: Check distribution metadata
        run: twine check --strict dist/*
